<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio Profile</title>
    <style>
        @font-face {
            font-family: 'MamaFont';
            src: url('ttf/mama.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'MamaFont', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Видео фон на весь экран */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
        }

        /* Затемнение фона */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* Контейнер для контента */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        /* Карточка профиля в стиле Material Design 3 + Apple Glassmorphism */
        .profile-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 32px;
            padding: 64px 96px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.2),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .profile-card:hover {
            transform: scale(1.02);
        }

        /* Заголовок */
        .profile-card h1 {
            color: #fff;
            margin-bottom: 48px;
            font-size: 2.8em;
            font-weight: 500;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Кнопка в стиле Material Design 3 */
        .enter-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 64px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            font-family: 'MamaFont', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: 
                0 4px 24px 0 rgba(0, 0, 0, 0.15),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.5s ease;
        }

        .enter-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.25),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        .enter-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .profile-card {
                padding: 48px 32px;
                margin: 24px;
                border-radius: 24px;
            }

            .profile-card h1 {
                font-size: 2em;
                margin-bottom: 32px;
            }

            .enter-btn {
                padding: 18px 48px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Видео фон -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="videos/background.mp4" type="video/mp4">
    </video>

    <!-- Затемнение -->
    <div class="overlay"></div>

    <!-- Основной контент -->
    <div class="container">
        <div class="profile-card">
            <h1>Welcome to My Profile</h1>
            <button class="enter-btn" onclick="enterProfile()">Click Enter Profile</button>
        </div>
    </div>

    <script>
        // Флаг для отслеживания состояния
        let isEntered = false;

        function enterProfile() {
            if (isEntered) return;
            isEntered = true;

            const card = document.querySelector('.profile-card');
            const video = document.getElementById('bg-video');
            
            // Плавное исчезновение карточки
            card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.85) translateY(30px)';
            
            // Включаем полный экран для видео
            setTimeout(() => {
                card.style.display = 'none';
                
                // Запрашиваем полный экран для всего документа
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log('Fullscreen не поддерживается или заблокирован:', err);
                    });
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
                
                // Убеждаемся, что видео играет
                video.play().catch(err => {
                    console.log('Ошибка воспроизведения видео:', err);
                });
            }, 600);
        }

        // Обработка ошибок загрузки видео
        const bgVideo = document.getElementById('bg-video');
        bgVideo.addEventListener('error', function(e) {
            console.error('Ошибка загрузки видео:', e);
            console.log('Проверьте, что файл videos/background.mp4 существует');
        });

        // Попытка автовоспроизведения при загрузке страницы
        window.addEventListener('load', function() {
            bgVideo.play().catch(err => {
                console.log('Автовоспроизведение заблокировано браузером, ждём взаимодействия');
            });
        });
    </script>
</body>
</html>
